version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quality_intelligence_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quality_user
      POSTGRES_PASSWORD: quality_secret
      POSTGRES_DB: quality_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_user -d quality_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quality_intelligence_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://quality_user:quality_secret@db:5432/quality_db
      - SECRET_KEY=dev_secret_key_12345
      - API_BASE_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quality_intelligence_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
